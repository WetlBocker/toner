name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements.lock'
      - name: Look for undefined names and other real mistakes
        shell: pwsh
        run: |
          $out = python -m pyflakes core drivers ui app.py cli.py
          $bad = $out | Where-Object { $_ -match 'undefined name|redefinition of unused|syntax' }
          if ($bad) { $bad; exit 1 }
          exit 0                                  # pyflakes exits 1 for harmless unused imports; only the patterns above fail the build
      # As on Linux: Windows Error Reporting saves a dump when python.exe crashes, and cdb (the Windows SDK's debugger) prints its C++ stacks.
      - name: Crash dumps on, and proof that cdb can read one (a deliberate crash)
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\python.exe'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -Value 'C:\cores' -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -Value 1 -PropertyType DWord -Force | Out-Null      # a minidump: every thread's stack, small
          New-Item -ItemType Directory -Force C:\cores | Out-Null
          Start-Service WerSvc -ErrorAction SilentlyContinue     # Manual (on demand) on the runner; started so it is ready
          $cdb = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe', 'C:\Program Files\Windows Kits\10\Debuggers\x64\cdb.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($cdb) { "CDB=$($cdb.FullName)" >> $env:GITHUB_ENV }
          # ctypes catches a bad read in its own calls (an OSError, no crash), so the crash is a native thread started at address 1
          @'
          import ctypes
          k = ctypes.windll.kernel32
          k.CreateThread.restype = ctypes.c_void_p
          k.CreateThread.argtypes = [ctypes.c_void_p, ctypes.c_size_t, ctypes.c_void_p, ctypes.c_void_p, ctypes.c_uint32, ctypes.c_void_p]
          k.WaitForSingleObject.argtypes = [ctypes.c_void_p, ctypes.c_uint32]
          k.SetErrorMode(k.GetErrorMode() & ~2)     # the runner passes down 0x8003; its 0x2 (no fault box) skips error reporting
          k.WaitForSingleObject(k.CreateThread(None, 0, 1, None, 0, None), 10000)
          '@ | Out-File -Encoding utf8 "$env:RUNNER_TEMP\crash.py"
          python -X faulthandler "$env:RUNNER_TEMP\crash.py"
          foreach ($i in 1..20) { if (Get-ChildItem C:\cores\*.dmp -ErrorAction SilentlyContinue) { break }; Start-Sleep -Milliseconds 500 }
          $d = Get-ChildItem C:\cores\*.dmp -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($d -and $cdb -and ((& $cdb.FullName -z $d.FullName -c ".ecxr; kn 10; q" 2>&1) -match 'Child-SP')) {
            "A crash leaves a dump cdb can read."
          } else {
            "::warning::A deliberate crash left no dump cdb could read (dump: $([bool]$d), cdb: $([bool]$cdb)): a crash in the tests will show Python frames only."
          }
          Remove-Item C:\cores\*.dmp -ErrorAction SilentlyContinue
          exit 0
      - name: Run the test suite
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        # the error mode without 0x2, so a crashing test is reported (and dumped); each test file's process inherits it from run_all
        run: python -c "import ctypes, runpy, sys; k = ctypes.windll.kernel32; k.SetErrorMode(k.GetErrorMode() & ~2); sys.argv = ['tests/run_all.py']; runpy.run_path('tests/run_all.py', run_name='__main__')"
      - name: C++ stacks of any test that crashed
        if: failure()
        shell: pwsh
        run: |
          foreach ($d in Get-ChildItem C:\cores\*.dmp -ErrorAction SilentlyContinue) {
            "== $($d.Name)"
            if ($env:CDB) { & $env:CDB -z $d.FullName -c ".ecxr; kn 40; ~*kn 40; q" 2>&1 | Select-Object -First 600 } else { "(no cdb on this runner)" }
          }
          exit 0
  test-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: The libraries Qt needs to draw windows (offscreen too)
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-render-util0 libxcb-image0 libxcb-randr0 libxcb-xinerama0 libdbus-1-3 libfontconfig1 fonts-dejavu traceroute libnss3 libnspr4 libasound2t64 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libgbm1 libxss1 libatk-bridge2.0-0 libcups2 gdb   # then the charts' Qt WebEngine (test_webchart); gdb reads crash dumps
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements.lock'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.24"
          cache-dependency-path: agent/go.sum
      # A segfaulting test shows only its Python frames; a core dump read by gdb shows the C++ ones (which PySide or Qt object it was).
      - name: Crash dumps on, and proof that gdb can read one (a deliberate crash)
        run: |
          sudo mkdir -p /tmp/cores && sudo chmod 1777 /tmp/cores
          sudo sysctl -w kernel.core_pattern=/tmp/cores/core.%e.%p
          ulimit -c unlimited
          python -c "import ctypes; ctypes.string_at(0)" || true
          c=$(ls /tmp/cores/core.* 2>/dev/null | head -1)
          if [ -n "$c" ] && gdb -batch -q -ex bt "$(command -v python)" "$c" 2>&1 | grep -q "^#0"; then
            echo "A crash leaves a core dump gdb can read."
          else
            echo "::warning::A deliberate crash left no readable core dump: a crash in the tests will show Python frames only."
          fi
          rm -f /tmp/cores/core.*
      - name: Run the test suite (with the Go toolchain, test_agent_go builds and runs the binary agent against the receiver)
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: |
          ulimit -c unlimited
          python tests/run_all.py
      - name: C++ stacks of any test that crashed
        if: failure()
        run: |
          for c in /tmp/cores/core.*; do
            [ -e "$c" ] || continue
            echo "== $c"
            gdb -batch -q -ex "thread apply all bt 40" "$(command -v python)" "$c" 2>&1 | grep -v "^\[New LWP" | head -600
          done
  agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.24"
          cache-dependency-path: agent/go.sum
      - name: Vet the agent for every platform it is built for
        working-directory: agent
        run: |
          go mod tidy
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=darwin GOARCH=arm64 go vet ./...
          go test ./...
      - name: Build it for every platform
        run: bash agent/build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: toner-agent
          path: agent/dist/toner-agent-*
