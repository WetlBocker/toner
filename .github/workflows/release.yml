name: Release
# Push a tag like v1.3.0 (the number must match core/version.py) to build the installer and publish it as a GitHub release.
# The Linux job then adds Toner-<version>-x86_64.AppImage to the same release.
on:
  push:
    tags: ["v*"]
jobs:
  agent:                                          # the toner-agent binaries, for the installer, the AppImage and the release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5  # v5.5.0
        with:
          go-version: "1.24"
          cache-dependency-path: agent/go.sum
      - run: bash agent/build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: toner-agent
          path: agent/dist/toner-agent-*
  release:
    needs: agent
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Skip if this release was already published by hand
        id: have
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "skip=true" >> $env:GITHUB_OUTPUT; "This release already exists, nothing to build." } else { "skip=false" >> $env:GITHUB_OUTPUT; $global:LASTEXITCODE = 0 }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.have.outputs.skip != 'true'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        if: steps.have.outputs.skip != 'true'
        with:
          python-version: "3.13"
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements.lock'
        if: steps.have.outputs.skip != 'true'
      - name: Check the tag matches the version in the code
        if: steps.have.outputs.skip != 'true'
        shell: pwsh
        run: |
          $v = (python -c "from core.version import VERSION; print(VERSION)").Trim()
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match core/version.py ($v)" }
      - name: Run the tests
        if: steps.have.outputs.skip != 'true'
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: python tests/run_all.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        if: steps.have.outputs.skip != 'true'
        with:
          name: toner-agent
          path: agent/dist
      - name: Sign the Windows agent too (when the signing secrets exist)
        if: steps.have.outputs.skip != 'true'
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PASSWORD: ${{ secrets.SIGN_PASSWORD }}
        run: |
          if ($env:SIGN_PFX_BASE64) {
            [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\sign.pfx", [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
            if ($signtool) {
              foreach ($exe in Get-ChildItem agent\dist\toner-agent-windows-*.exe) {
                & $signtool.FullName sign /f "$env:RUNNER_TEMP\sign.pfx" /p $env:SIGN_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $exe.FullName
                if ($LASTEXITCODE) { throw "Signing $($exe.Name) failed" }
              }
            }
          }
      - name: Install Inno Setup if the runner lacks it
        if: steps.have.outputs.skip != 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") -and -not (Test-Path "$env:ProgramFiles\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build the installer (signed when the SIGN_PFX_BASE64 and SIGN_PASSWORD secrets exist)
        if: steps.have.outputs.skip != 'true'
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PASSWORD: ${{ secrets.SIGN_PASSWORD }}
        run: |
          if ($env:SIGN_PFX_BASE64) {
            [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\sign.pfx", [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
            $env:SIGN_PFX = "$env:RUNNER_TEMP\sign.pfx"
          }
          powershell -File packaging\build.ps1
      - name: Publish the release
        if: steps.have.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (python -c "from core.version import VERSION; print(VERSION)").Trim()
          gh release create "${{ github.ref_name }}" "build\installer\Toner-Setup-$v.exe" (Get-ChildItem agent\dist\toner-agent-* | ForEach-Object { $_.FullName }) --title "Toner $v" --generate-notes

  linux:
    needs: release                                # the release exists by now (made by the Windows job, or by hand)
    runs-on: ubuntu-22.04                         # the oldest supported Ubuntu: the AppImage then runs on newer ones too
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Skip if this release already has its AppImage
        id: have
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | grep -q 'AppImage$'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "The AppImage is already there."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.have.outputs.skip != 'true'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        if: steps.have.outputs.skip != 'true'
        with:
          python-version: "3.13"
      - name: The libraries Qt needs, and what the AppImage tool uses
        if: steps.have.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-render-util0 libxcb-image0 libxcb-randr0 libxcb-xinerama0 libdbus-1-3 libfontconfig1 fonts-dejavu traceroute file desktop-file-utils
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements.lock'
        if: steps.have.outputs.skip != 'true'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        if: steps.have.outputs.skip != 'true'
        with:
          name: toner-agent
          path: agent/dist
      - name: Run the tests
        if: steps.have.outputs.skip != 'true'
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: python tests/run_all.py
      - name: Build the AppImage
        if: steps.have.outputs.skip != 'true'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"           # the runner has no FUSE: appimagetool unpacks itself instead
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          APPIMAGETOOL="$PWD/appimagetool" bash packaging/build_linux.sh
      - name: Add it to the release
        if: steps.have.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python -c "from core.version import VERSION; print(VERSION)")
          gh release upload "${{ github.ref_name }}" "build/installer/Toner-$v-x86_64.AppImage"
      - name: SHA256SUMS.txt, so anyone can check the files by hand
        if: steps.have.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Hash the files the release actually holds. This job's own agent/dist is not them: the Windows job signs its
          # copies before publishing, and a rerun builds the agent again (Go builds are not byte for byte the same).
          v=$(python -c "from core.version import VERSION; print(VERSION)")
          mkdir -p build/sums && cd build/sums
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --pattern "Toner-Setup-$v.exe" --pattern "Toner-$v-x86_64.AppImage" --pattern "toner-agent-*"
          sha256sum "Toner-Setup-$v.exe" "Toner-$v-x86_64.AppImage" toner-agent-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "${{ github.ref_name }}" SHA256SUMS.txt --clobber
